name: Build libpcap Security Research Targets

on:
  workflow_dispatch:
    inputs:
      pcap_ref:
        description: "libpcap git ref, branch, tag, or commit"
        required: false
        default: "master"
      run_tests:
        description: "Run the libpcap test suite after building"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            id: asan-ubsan
            build_type: Debug
            c_flags: >-
              -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined
              -fno-sanitize-recover=all
            linker_flags: >-
              -fsanitize=address,undefined
            runtime_env: >-
              ASAN_OPTIONS=abort_on_error=1:halt_on_error=1:detect_leaks=1:strict_string_checks=1:check_initialization_order=1:symbolize=1
              UBSAN_OPTIONS=abort_on_error=1:halt_on_error=1:print_stacktrace=1:symbolize=1
            run_tests: true

          - name: MemorySanitizer
            id: msan
            build_type: Debug
            c_flags: >-
              -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=memory -fsanitize-memory-track-origins=2
              -fPIE
            linker_flags: >-
              -fsanitize=memory -fsanitize-memory-track-origins=2
              -fPIE -pie
            runtime_env: >-
              MSAN_OPTIONS=abort_on_error=1:halt_on_error=1:exit_code=86:track_origins=2:symbolize=1:print_stats=1
            # System libc and libssl are not MSan-instrumented; build the
            # targets but do not auto-run them to avoid false positives.
            run_tests: false

          - name: ThreadSanitizer
            id: tsan
            build_type: Debug
            c_flags: >-
              -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=thread
            linker_flags: >-
              -fsanitize=thread
            runtime_env: >-
              TSAN_OPTIONS=abort_on_error=1:halt_on_error=1:second_deadlock_stack=1:history_size=7:symbolize=1
            run_tests: true

          - name: Coverage
            id: coverage
            build_type: Debug
            c_flags: >-
              -O0 -g3 -fno-omit-frame-pointer
              -fprofile-instr-generate -fcoverage-mapping
            linker_flags: >-
              -fprofile-instr-generate -fcoverage-mapping
            runtime_env: >-
              LLVM_PROFILE_FILE=pcap-%p.profraw
            run_tests: true

          - name: Hardened RelWithDebInfo
            id: hardened
            build_type: RelWithDebInfo
            c_flags: >-
              -O2 -g3 -fno-omit-frame-pointer
              -fstack-protector-strong -D_FORTIFY_SOURCE=3
              -fPIE -Wformat -Wformat-security -Werror=format-security
            linker_flags: >-
              -fPIE -pie -Wl,-z,relro,-z,now -Wl,-z,noexecstack
            runtime_env: ""
            run_tests: true

          - name: Release Baseline
            id: release
            build_type: Release
            c_flags: >-
              -O2 -g1 -fno-omit-frame-pointer
            linker_flags: ""
            runtime_env: ""
            run_tests: true

    env:
      CC: clang
      BUILD_DIR: build-${{ matrix.id }}
      INSTALL_DIR: install-${{ matrix.id }}
      PACKAGE_DIR: package/libpcap-${{ matrix.id }}

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential clang llvm lld cmake ninja-build \
            pkg-config flex bison \
            libssl-dev zlib1g-dev \
            python3 zip file ca-certificates

          clang --version
          cmake --version
          ninja --version
          llvm-symbolizer --version

      - name: Clone libpcap
        shell: bash
        run: |
          set -euxo pipefail

          git clone https://github.com/the-tcpdump-group/libpcap.git libpcap
          cd libpcap
          git checkout "${{ inputs.pcap_ref }}"
          git submodule update --init --recursive
          git rev-parse HEAD | tee ../PCAP_COMMIT.txt
          git status --short

      - name: Configure ${{ matrix.name }}
        shell: bash
        run: |
          set -euxo pipefail

          cmake -S libpcap -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_INSTALL_PREFIX="$PWD/$INSTALL_DIR" \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_C_FLAGS="${{ matrix.c_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.linker_flags }}" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DENABLE_REMOTE=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build library and test programs
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build "$BUILD_DIR" --parallel "$(nproc)" --verbose

          echo "Built executables:"
          find "$BUILD_DIR" -maxdepth 4 -type f -executable -print | sort

      - name: Verify sanitizer instrumentation
        if: matrix.id == 'asan-ubsan' || matrix.id == 'msan' || matrix.id == 'tsan'
        shell: bash
        run: |
          set -euxo pipefail

          case "${{ matrix.id }}" in
            asan-ubsan) needle='__asan_init|__ubsan_handle' ;;
            msan)       needle='__msan_init'                ;;
            tsan)       needle='__tsan_init'                ;;
          esac

          # Try standard test-program names, then fuzz harnesses.
          mapfile -t candidates < <(
            find "$BUILD_DIR" -type f -executable \
              \( -name 'filtertest'      -o -name 'findalldevstest' \
                 -o -name 'opentest'    \
                 -o -name 'fuzz_filter' -o -name 'fuzz_pcap' \
                 -o -name 'fuzz_both' \)
          )

          # Last-resort fallback: the shared library carries the same
          # instrumentation and is always produced.
          if [ "${#candidates[@]}" -eq 0 ]; then
            mapfile -t candidates < <(
              find "$BUILD_DIR" -type f -name 'libpcap*.so*' ! -type l
            )
          fi

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "No candidate found for instrumentation verification"
            exit 1
          fi

          verified=0
          for binary in "${candidates[@]}"; do
            if nm -an "$binary" 2>/dev/null | grep -Eq "$needle"; then
              echo "Instrumentation detected in $binary"
              verified=1
              break
            fi
          done

          test "$verified" -eq 1

      - name: Run test suite
        if: inputs.run_tests && matrix.run_tests
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="/usr/lib/llvm-18/bin:$PATH"
          export LLVM_SYMBOLIZER_PATH="$(command -v llvm-symbolizer)"

          while IFS= read -r assignment; do
            [ -z "$assignment" ] && continue
            export "$assignment"
          done < <(printf '%s\n' '${{ matrix.runtime_env }}' | tr ' ' '\n')

          ctest --test-dir "$BUILD_DIR" \
            --output-on-failure \
            --timeout 180 \
            --parallel "$(nproc)"

      - name: Generate LLVM coverage report
        if: matrix.id == 'coverage' && inputs.run_tests
        shell: bash
        run: |
          set -euxo pipefail

          mapfile -t profiles < <(find . -name '*.profraw' -type f)
          if [ "${#profiles[@]}" -eq 0 ]; then
            echo "No .profraw files were produced"
            exit 1
          fi

          llvm-profdata merge -sparse "${profiles[@]}" -o "$BUILD_DIR/pcap.profdata"

          mapfile -t objects < <(
            find "$BUILD_DIR" -type f -executable \
              \( -name 'filtertest'      -o -name 'findalldevstest' \
                 -o -name 'opentest'    \
                 -o -name 'fuzz_filter' -o -name 'fuzz_pcap' \
                 -o -name 'fuzz_both' \)
          )

          if [ "${#objects[@]}" -eq 0 ]; then
            echo "No instrumented executables found"
            exit 1
          fi

          primary_object="${objects[0]}"
          object_args=()
          for object in "${objects[@]:1}"; do
            object_args+=( -object "$object" )
          done

          llvm-cov report "$primary_object" "${object_args[@]}" \
            -instr-profile="$BUILD_DIR/pcap.profdata" \
            -ignore-filename-regex='(testprogs|CMakeFiles)' \
            | tee "$BUILD_DIR/coverage-summary.txt"

          llvm-cov show "$primary_object" "${object_args[@]}" \
            -instr-profile="$BUILD_DIR/pcap.profdata" \
            -format=html \
            -output-dir="$BUILD_DIR/coverage-html" \
            -ignore-filename-regex='(testprogs|CMakeFiles)'

      - name: Install build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --install "$BUILD_DIR"

      - name: Package research build
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$PACKAGE_DIR"/{bin,lib,include,build-info,source}

          copy_if_exists() {
            local src="$1"
            local dst="$2"
            if [ -e "$src" ]; then
              cp -a "$src" "$dst"
            fi
          }

          copy_tree_if_exists() {
            local src="$1"
            local dst="$2"
            if [ -d "$src" ]; then
              mkdir -p "$dst"
              cp -a "$src/." "$dst/"
            fi
          }

          copy_tree_if_exists "$INSTALL_DIR/bin" "$PACKAGE_DIR/bin"
          copy_tree_if_exists "$INSTALL_DIR/lib" "$PACKAGE_DIR/lib"
          copy_tree_if_exists "$INSTALL_DIR/include" "$PACKAGE_DIR/include"

          # Copy instrumented test programs that aren't installed by default
          while IFS= read -r binary; do
            copy_if_exists "$binary" "$PACKAGE_DIR/bin/"
          done < <(
            find "$BUILD_DIR" -type f -executable \
              \( -name 'filtertest'      -o -name 'findalldevstest' \
                 -o -name 'opentest'    -o -name 'selpolltest' \
                 -o -name 'threadstest' -o -name 'listDataLinks' \
                 -o -name 'fuzz_filter' -o -name 'fuzz_pcap' \
                 -o -name 'fuzz_both' \)
          )

          find "$BUILD_DIR" -type f \
            \( -name 'libpcap*.a' -o -name 'libpcap*.so*' \) \
            -exec cp -a {} "$PACKAGE_DIR/lib/" \;

          copy_if_exists "$BUILD_DIR/compile_commands.json" "$PACKAGE_DIR/build-info/"
          copy_if_exists "$BUILD_DIR/CMakeCache.txt" "$PACKAGE_DIR/build-info/"
          copy_if_exists "$BUILD_DIR/coverage-summary.txt" "$PACKAGE_DIR/build-info/"
          copy_if_exists "$BUILD_DIR/pcap.profdata" "$PACKAGE_DIR/build-info/"
          copy_tree_if_exists "$BUILD_DIR/coverage-html" "$PACKAGE_DIR/coverage-html"
          copy_if_exists "PCAP_COMMIT.txt" "$PACKAGE_DIR/build-info/"

          # Key security-relevant source files
          for src in \
            libpcap/gencode.c \
            libpcap/optimize.c \
            libpcap/grammar.y \
            libpcap/scanner.l \
            libpcap/sf-pcap.c \
            libpcap/pcap.c \
            libpcap/pcap-bpf.c \
            libpcap/pcap-linux.c
          do
            copy_if_exists "$src" "$PACKAGE_DIR/source/"
          done

          cat > "$PACKAGE_DIR/RUN_ENV.sh" <<EOF
          #!/usr/bin/env bash
          HERE="\$(cd "\$(dirname "\${BASH_SOURCE[0]}")" && pwd)"
          export PATH="\$HERE/bin:\$PATH"
          export LD_LIBRARY_PATH="\$HERE/lib:\${LD_LIBRARY_PATH:-}"
          export LLVM_SYMBOLIZER_PATH="\${LLVM_SYMBOLIZER_PATH:-\$(command -v llvm-symbolizer 2>/dev/null || true)}"
          EOF

          case "${{ matrix.id }}" in
            asan-ubsan)
              cat >> "$PACKAGE_DIR/RUN_ENV.sh" <<'EOF'
          export ASAN_OPTIONS="abort_on_error=1:halt_on_error=1:detect_leaks=1:strict_string_checks=1:symbolize=1"
          export UBSAN_OPTIONS="abort_on_error=1:halt_on_error=1:print_stacktrace=1:symbolize=1"
          EOF
              ;;
            msan)
              cat >> "$PACKAGE_DIR/RUN_ENV.sh" <<'EOF'
          export MSAN_OPTIONS="abort_on_error=1:halt_on_error=1:exit_code=86:track_origins=2:symbolize=1:print_stats=1"
          EOF
              ;;
            tsan)
              cat >> "$PACKAGE_DIR/RUN_ENV.sh" <<'EOF'
          export TSAN_OPTIONS="abort_on_error=1:halt_on_error=1:second_deadlock_stack=1:history_size=7:symbolize=1"
          EOF
              ;;
          esac

          chmod +x "$PACKAGE_DIR/RUN_ENV.sh"

          cat > "$PACKAGE_DIR/README_RUN.txt" <<EOF
          libpcap security research build
          Build: ${{ matrix.name }}
          Commit: $(cat PCAP_COMMIT.txt)

          Usage:
            source ./RUN_ENV.sh

          BPF filter compiler (primary research target — exercises gencode.c / grammar.y):
            ./bin/filtertest "tcp and dst port 80"
            ./bin/filtertest "ip[2:2] > 100"
            ./bin/filtertest "(((ip[2:2] - ((ip[0]&0xf)<<2)) - ((tcp[12]&0xf0)>>2)) != 0)"

          Device enumeration and open tests (requires CAP_NET_RAW or pcap file path):
            ./bin/findalldevstest
            ./bin/opentest <interface-or-file>

          pcap file parser (offline — no privileges needed):
            Write a custom harness that calls pcap_open_offline() against crafted .pcap inputs.
            Generate corpus with scapy or hand-craft files starting from the 4-byte magic:
              little-endian: d4 c3 b2 a1 (classic pcap)
              big-endian:    a1 b2 c3 d4
              pcapng:        0a 0d 0d 0a

          Notes:
          - filtertest is the recommended entry point for BPF compiler (pcap_compile) research.
          - MSan builds are not auto-tested; system libc/libssl are not MSan-instrumented.
          - ASan+UBSan is the recommended starting point for both BPF and file-parser PoCs.
          - Wire filtertest or a custom pcap_open_offline harness into AFL++ or libFuzzer for
            automated discovery; use -DBUILD_SHARED_LIBS=OFF for a self-contained fuzz target.
          EOF

          find "$PACKAGE_DIR" -maxdepth 4 -type f | sort

      - name: Create archive and checksum
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE="libpcap-${{ matrix.id }}-x86_64-linux.zip"
          cd package
          zip -r "../$ARCHIVE" "libpcap-${{ matrix.id }}"
          cd ..
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          ls -lh "$ARCHIVE" "$ARCHIVE.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libpcap-${{ matrix.id }}-x86_64-linux
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            libpcap-${{ matrix.id }}-x86_64-linux.zip
            libpcap-${{ matrix.id }}-x86_64-linux.zip.sha256
