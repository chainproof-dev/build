name: Build c-ares x64 security-research matrix

on:
  workflow_dispatch:
    inputs:
      cares_ref:
        description: c-ares Git ref or exact 40-character commit SHA
        required: true
        default: refs/heads/main
        type: string
      runner_label:
        description: Runner label for all builds
        required: true
        default: ubuntu-24.04
        type: string
      keep_github_backup:
        description: Retain each build archive as a GitHub artifact for three days
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cares-x64-security-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARES_REMOTE: https://github.com/c-ares/c-ares.git

jobs:
  resolve-source:
    name: Resolve exact source revision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cares_revision: ${{ steps.resolve.outputs.cares_revision }}
      cares_short_revision: ${{ steps.resolve.outputs.cares_short_revision }}
    steps:
      - name: Resolve c-ares revision
        id: resolve
        shell: bash
        env:
          REQUESTED_CARES_REF: ${{ inputs.cares_ref }}
        run: |
          set -Eeuo pipefail

          if [[ "$REQUESTED_CARES_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            cares_revision="${REQUESTED_CARES_REF,,}"
          else
            cares_revision="$(git ls-remote "$CARES_REMOTE" "$REQUESTED_CARES_REF" | awk 'NR == 1 {print $1}')"
          fi

          if [[ ! "$cares_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve c-ares ref: $REQUESTED_CARES_REF" >&2
            exit 1
          fi

          {
            echo "cares_revision=$cares_revision"
            echo "cares_short_revision=${cares_revision:0:12}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Resolved revision"
            echo
            echo "- All builds use c-ares: \`$cares_revision\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-cares:
    name: ${{ matrix.order }} · ${{ matrix.id }}
    needs: resolve-source
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fuzzing-oriented profiles (libFuzzer harness, corpus-driven coverage
          # builds, OSS-Fuzz style instrumentation) are intentionally excluded
          # from this matrix. Add a dedicated job if you need one later.
          - order: "01"
            id: x64-asan-ubsan
          - order: "02"
            id: x64-tsan
          - order: "03"
            id: x64-msan
          - order: "04"
            id: x64-debug-asserts
          - order: "05"
            id: x64-release-symbolized

    env:
      BUILD_ID: ${{ matrix.id }}
      CARES_REVISION: ${{ needs.resolve-source.outputs.cares_revision }}
      CARES_SHORT_REVISION: ${{ needs.resolve-source.outputs.cares_short_revision }}
      SRC_DIR: ${{ github.workspace }}/.ci/c-ares
      PACKAGE_ROOT: ${{ github.workspace }}/.ci/package

    steps:
      - name: Show resources
        shell: bash
        run: |
          set -Eeuo pipefail
          uname -a
          echo "Runner: $RUNNER_NAME"
          echo "CPUs: $(nproc)"
          free -h || true
          df -h

      - name: Install build toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            file \
            git \
            libc++-dev \
            libc++abi-dev \
            llvm \
            ninja-build \
            pigz \
            python3 \
            valgrind

      - name: Clone c-ares at exact revision
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "$CARES_REMOTE" "$SRC_DIR"
          cd "$SRC_DIR"

          if ! git cat-file -e "$CARES_REVISION^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$CARES_REVISION"
          fi
          git checkout --detach "$CARES_REVISION"

          actual_revision="$(git rev-parse HEAD)"
          [[ "$actual_revision" == "$CARES_REVISION" ]]

      - name: Configure build (${{ matrix.id }})
        id: configure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SRC_DIR"
          build_dir="$SRC_DIR/build-$BUILD_ID"
          echo "build_dir=$build_dir" >> "$GITHUB_OUTPUT"

          export CC=clang
          export CXX=clang++

          common_flags=(
            -DCARES_STATIC=ON
            -DCARES_SHARED=OFF
            -DCARES_BUILD_TESTS=ON
            -DCARES_BUILD_TOOLS=ON
            -G Ninja
          )

          case "$BUILD_ID" in
            x64-asan-ubsan)
              # Primary hunting ground: use-after-free / double-free in the
              # async retry paths, OOB reads in packet decompression and
              # record parsers.
              export CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g -O1"
              export CXXFLAGS="$CFLAGS"
              export LDFLAGS="-fsanitize=address,undefined"
              cmake -S . -B "$build_dir" -DCMAKE_BUILD_TYPE=Debug "${common_flags[@]}"
              ;;

            x64-tsan)
              # Targets races in the reworked async engine: query lifetime
              # crossing ares_requeue_query / read_answer / process_answer.
              export CFLAGS="-fsanitize=thread -fno-omit-frame-pointer -g -O1"
              export CXXFLAGS="$CFLAGS"
              export LDFLAGS="-fsanitize=thread"
              cmake -S . -B "$build_dir" -DCMAKE_BUILD_TYPE=Debug "${common_flags[@]}"
              ;;

            x64-msan)
              # Uninitialized-read hunting in the record parsers (SVCB/HTTPS,
              # CAA, NAPTR). NOTE: system libc/libc++ are not MSan-instrumented
              # on this runner, so expect some false positives originating
              # from library frames — treat findings inside libc as
              # suspect until reproduced against an instrumented libc++.
              export CFLAGS="-fsanitize=memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer -g -O1 -stdlib=libc++"
              export CXXFLAGS="$CFLAGS"
              export LDFLAGS="-fsanitize=memory -stdlib=libc++"
              cmake -S . -B "$build_dir" -DCMAKE_BUILD_TYPE=Debug "${common_flags[@]}"
              ;;

            x64-debug-asserts)
              # No sanitizer instrumentation — used for GDB/Valgrind triage
              # and as a control build to confirm sanitizer-only findings.
              export CFLAGS="-fno-omit-frame-pointer -g -O0"
              export CXXFLAGS="$CFLAGS"
              cmake -S . -B "$build_dir" -DCMAKE_BUILD_TYPE=Debug "${common_flags[@]}"
              ;;

            x64-release-symbolized)
              # Optimized but symbolized baseline, useful for DoS / CPU
              # exhaustion timing work (e.g. compression-pointer-chain class)
              # where debug builds skew timing too much to be representative.
              export CFLAGS="-fno-omit-frame-pointer -g -O2 -D_FORTIFY_SOURCE=2"
              export CXXFLAGS="$CFLAGS"
              cmake -S . -B "$build_dir" -DCMAKE_BUILD_TYPE=RelWithDebInfo "${common_flags[@]}"
              ;;

            *)
              echo "Unknown build id: $BUILD_ID" >&2
              exit 1
              ;;
          esac

          # Record the effective cache so option names/defaults can be
          # verified against whatever c-ares revision was actually checked
          # out (CMake option surface has shifted across 1.30–1.34.x).
          cmake -B "$build_dir" -LAH > "$build_dir/effective-cmake-cache.txt" 2>&1 || true

      - name: Build with ninja
        shell: bash
        env:
          BUILD_DIR: ${{ steps.configure.outputs.build_dir }}
        run: |
          set -Eeuo pipefail
          ninja -C "$BUILD_DIR" -j "$(nproc)"
          df -h

      - name: Run test suite / smoke checks
        shell: bash
        env:
          BUILD_DIR: ${{ steps.configure.outputs.build_dir }}
        run: |
          set -Eeuo pipefail
          cd "$BUILD_DIR"

          export ASAN_OPTIONS="abort_on_error=1:detect_leaks=1:symbolize=1"
          export UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"
          export TSAN_OPTIONS="halt_on_error=1:history_size=7"
          export MSAN_OPTIONS="abort_on_error=1:poison_in_dtor=1"

          # ctest is allowed to report failures without failing the job:
          # a sanitizer trip or crash inside the suite is itself a result
          # worth keeping the archive for, not a reason to discard it.
          ctest --output-on-failure -j "$(nproc)" 2>&1 | tee ctest-output.log || true

          if [[ "$BUILD_ID" == x64-debug-asserts ]]; then
            find . -maxdepth 1 -type f -executable -name 'ares_test*' -print0 \
              | xargs -0 -r -I{} valgrind --error-exitcode=99 --leak-check=full \
                  --log-file=valgrind-%p.log {} --gtest_filter='-*Live*' \
              || true
          fi

      - name: Package build artifacts
        id: package
        shell: bash
        env:
          BUILD_DIR: ${{ steps.configure.outputs.build_dir }}
        run: |
          set -Eeuo pipefail
          stage="$PACKAGE_ROOT/c-ares-$BUILD_ID-$CARES_SHORT_REVISION"
          archive="$RUNNER_TEMP/c-ares-$BUILD_ID-$CARES_SHORT_REVISION-linux-x64.tar.gz"
          mkdir -p "$stage"

          find "$BUILD_DIR" -maxdepth 2 -type f \
            \( -name 'libcares*' -o -name 'ares_test*' -o -name 'adig' -o -name 'ahost' -o -name 'acountry' \) \
            -exec cp -a {} "$stage/" \; 2>/dev/null || true

          cp "$BUILD_DIR/effective-cmake-cache.txt" "$stage/" 2>/dev/null || true
          cp "$BUILD_DIR/ctest-output.log" "$stage/" 2>/dev/null || true
          cp "$BUILD_DIR"/valgrind-*.log "$stage/" 2>/dev/null || true
          cp -r "$SRC_DIR/include" "$stage/include" 2>/dev/null || true

          {
            echo "build_id=$BUILD_ID"
            echo "cares_revision=$CARES_REVISION"
            echo "target_cpu=x64"
            echo "runner=$RUNNER_NAME"
            echo "nproc=$(nproc)"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "clang_version=$(clang --version | head -1)"
          } > "$stage/BUILD_INFO.txt"

          (
            cd "$stage"
            find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

          tar -C "$PACKAGE_ROOT" -cf - "$(basename "$stage")" \
            | pigz -1 -p "$(nproc)" > "$archive"

          test -s "$archive"
          sha256sum "$archive"
          ls -lh "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$archive")" >> "$GITHUB_OUTPUT"

      - name: Upload archive to sendit.sh
        id: sendit
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
        run: |
          set -Eeuo pipefail
          response="$(curl \
            --fail-with-body \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            -T "$ARCHIVE" \
            https://sendit.sh)"

          printf '%s\n' "$response"
          url="$(printf '%s\n' "$response" | grep -Eo 'https?://[^[:space:]<>]+' | tail -n 1)"
          [[ -n "$url" ]]

          link_file="$RUNNER_TEMP/sendit-link-${{ matrix.order }}-$BUILD_ID.txt"
          printf '%s\t%s\t%s\n' "$BUILD_ID" "$ARCHIVE_NAME" "$url" > "$link_file"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "link_file=$link_file" >> "$GITHUB_OUTPUT"

          {
            echo "## $BUILD_ID"
            echo
            echo "- c-ares revision: \`$CARES_REVISION\`"
            echo "- Archive: \`$ARCHIVE_NAME\`"
            echo "- Download: $url"
            echo "- SHA-256: \`$(sha256sum "$ARCHIVE" | awk '{print $1}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save link record
        uses: actions/upload-artifact@v4
        with:
          name: sendit-link-${{ matrix.order }}-${{ matrix.id }}
          path: ${{ steps.sendit.outputs.link_file }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Optional GitHub artifact backup
        if: ${{ inputs.keep_github_backup }}
        uses: actions/upload-artifact@v4
        with:
          name: c-ares-${{ matrix.id }}-${{ needs.resolve-source.outputs.cares_short_revision }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  collect-links:
    name: Collect all download links
    needs: [resolve-source, build-cares]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download link records
        uses: actions/download-artifact@v4
        with:
          pattern: sendit-link-*
          path: links
          merge-multiple: true

      - name: Create final link table
        shell: bash
        env:
          CARES_REVISION: ${{ needs.resolve-source.outputs.cares_revision }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          files=(links/sendit-link-*.txt)

          {
            echo "# c-ares x64 security-research build links"
            echo
            echo "- c-ares revision: \`$CARES_REVISION\`"
            echo
            echo "| Build | Archive | Download |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          : > all-sendit-links.txt
          for file in $(printf '%s\n' "${files[@]}" | sort); do
            IFS=$'\t' read -r build archive url < "$file"
            printf '%s\t%s\t%s\n' "$build" "$archive" "$url" >> all-sendit-links.txt
            printf '| `%s` | `%s` | %s |\n' "$build" "$archive" "$url" >> "$GITHUB_STEP_SUMMARY"
          done

          if (( ${#files[@]} != 5 )); then
            echo "Expected 5 successful uploads, found ${#files[@]}." >&2
            exit 1
          fi

      - name: Retain combined link list
        uses: actions/upload-artifact@v4
        with:
          name: all-sendit-links-${{ needs.resolve-source.outputs.cares_short_revision }}
          path: all-sendit-links.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
