name: Build FlatBuffers Security Runtimes

on:
  workflow_dispatch:
    inputs:
      flatbuffers_ref:
        description: "FlatBuffers git ref, branch, tag, or commit"
        required: false
        default: "master"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          # Production-style build: keep FlatBuffers' CMake defaults intact.
          # CMAKE_BUILD_TYPE=Release provides optimized, non-debug production
          # binaries while leaving the project's default FLATBUFFERS_* options
          # unchanged.
          - name: release
            cc: gcc
            cxx: g++
            build_type: Release
            configure_extra: ""
            cxx_flags: ""
            exe_ldflags: ""
            essential_targets: "flatbuffers flatc flattests"
            optional_targets: "flatsamplebinary flatsampletext flatsamplebfbs"
            run_tests: "true"

          - name: asan
            cc: clang
            cxx: clang++
            build_type: RelWithDebInfo
            configure_extra: "-DFLATBUFFERS_CODE_SANITIZE==address"
            cxx_flags: ""
            exe_ldflags: ""
            essential_targets: "flatbuffers flatc flattests"
            optional_targets: ""
            run_tests: "true"

          - name: ubsan
            cc: clang
            cxx: clang++
            build_type: RelWithDebInfo
            configure_extra: "-DFLATBUFFERS_CODE_SANITIZE==undefined"
            cxx_flags: "-fno-sanitize-recover=undefined"
            exe_ldflags: "-fno-sanitize-recover=undefined"
            essential_targets: "flatbuffers flatc flattests"
            optional_targets: ""
            run_tests: "true"

          - name: msan
            cc: clang
            cxx: clang++
            build_type: RelWithDebInfo
            configure_extra: "-DFLATBUFFERS_CODE_SANITIZE==memory -DFLATBUFFERS_CXX_FLAGS=-fsanitize-memory-track-origins=2"
            cxx_flags: "-stdlib=libc++"
            exe_ldflags: "-stdlib=libc++"
            essential_targets: "flatbuffers flatc flattests"
            optional_targets: ""
            run_tests: "true"

          - name: tsan
            cc: clang
            cxx: clang++
            build_type: RelWithDebInfo
            configure_extra: "-DFLATBUFFERS_CODE_SANITIZE==thread"
            cxx_flags: ""
            exe_ldflags: ""
            essential_targets: "flatbuffers flatc flattests"
            optional_targets: ""
            run_tests: "true"

          - name: cfi
            cc: clang
            cxx: clang++
            build_type: RelWithDebInfo
            configure_extra: "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON"
            cxx_flags: "-O1 -g -fno-omit-frame-pointer -flto=thin -fsanitize=cfi,cfi-icall -fvisibility=hidden"
            exe_ldflags: "-flto=thin -fsanitize=cfi,cfi-icall"
            essential_targets: "flatbuffers flatc flattests"
            optional_targets: ""
            run_tests: "true"

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git build-essential cmake ninja-build clang lld \
            libc++-dev libc++abi-dev \
            pkg-config zip curl ca-certificates file

      - name: Clone FlatBuffers
        shell: bash
        run: |
          set -euxo pipefail

          git clone https://github.com/google/flatbuffers.git flatbuffers
          cd flatbuffers
          git checkout "${{ github.event.inputs.flatbuffers_ref }}"
          git rev-parse HEAD | tee ../FLATBUFFERS_COMMIT.txt
          git status --short

      - name: Configure FlatBuffers
        shell: bash
        working-directory: flatbuffers
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CONFIGURE_EXTRA: ${{ matrix.configure_extra }}
          CXX_FLAGS_EXTRA: ${{ matrix.cxx_flags }}
          EXE_LDFLAGS_EXTRA: ${{ matrix.exe_ldflags }}
        run: |
          set -euxo pipefail

          mkdir -p "../build/${{ matrix.name }}"

          read -r -a CFG_ARGS <<< "$CONFIGURE_EXTRA"

          CMD=(
            cmake
            -S .
            -B "../build/${{ matrix.name }}"
            -G Ninja
            "-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}"
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DFLATBUFFERS_BUILD_TESTS=ON
            -DFLATBUFFERS_BUILD_FLATLIB=ON
            -DFLATBUFFERS_BUILD_FLATC=ON
            -DFLATBUFFERS_INSTALL=ON
            "${CFG_ARGS[@]}"
          )

          if [ -n "$CXX_FLAGS_EXTRA" ]; then
            CMD+=("-DCMAKE_CXX_FLAGS=$CXX_FLAGS_EXTRA")
          fi

          if [ -n "$EXE_LDFLAGS_EXTRA" ]; then
            CMD+=("-DCMAKE_EXE_LINKER_FLAGS=$EXE_LDFLAGS_EXTRA")
          fi

          echo "[+] Configure command:"
          printf ' %q' "${CMD[@]}"
          printf '\n'

          "${CMD[@]}"

      - name: Build essential targets
        shell: bash
        working-directory: flatbuffers
        run: |
          set -euxo pipefail

          echo "[+] Building essential targets: ${{ matrix.essential_targets }}"
          cmake --build "../build/${{ matrix.name }}" --parallel "$(nproc)" \
            --target ${{ matrix.essential_targets }}

      - name: Build optional targets
        shell: bash
        working-directory: flatbuffers
        run: |
          set -uxo pipefail

          echo "[+] Optional targets: ${{ matrix.optional_targets }}"

          for target in ${{ matrix.optional_targets }}; do
            echo "[+] Trying optional target: $target"
            if cmake --build "../build/${{ matrix.name }}" --parallel "$(nproc)" --target "$target"; then
              echo "[OK] Built optional target: $target"
            else
              echo "[WARN] Optional target failed or does not exist: $target"
            fi
          done

      - name: Run FlatBuffers tests
        if: matrix.run_tests == 'true'
        shell: bash
        working-directory: flatbuffers
        run: |
          set -euxo pipefail

          TEST_BIN="../build/${{ matrix.name }}/flattests"
          if [ -x "$TEST_BIN" ]; then
            echo "[+] Running flattests"
            "$TEST_BIN"
          else
            echo "[ERROR] flattests was not built: $TEST_BIN"
            exit 1
          fi

      - name: Install FlatBuffers
        shell: bash
        working-directory: flatbuffers
        run: |
          set -euxo pipefail

          DEST="$PWD/../package/${{ matrix.name }}/install"
          mkdir -p "$DEST"
          cmake --install "../build/${{ matrix.name }}" --prefix "$DEST"

      - name: Collect build files safely
        shell: bash
        run: |
          set -euxo pipefail

          PKG="package/${{ matrix.name }}"
          BUILD="build/${{ matrix.name }}"
          PREFIX="$PKG/install"

          mkdir -p "$PKG/bin" "$PKG/lib" "$PKG/include" "$PKG/build-info" "$PKG/src-snippets"

          copy_if_exists() {
            SRC="$1"
            DST="$2"

            if [ -e "$SRC" ]; then
              cp -a "$SRC" "$DST"
              echo "[copy] $SRC -> $DST"
            else
              echo "[skip] missing: $SRC"
            fi
          }

          copy_dir_if_exists() {
            SRC="$1"
            DST="$2"

            if [ -d "$SRC" ]; then
              mkdir -p "$DST"
              cp -a "$SRC/." "$DST/" || true
              echo "[copy-dir] $SRC -> $DST"
            else
              echo "[skip-dir] missing: $SRC"
            fi
          }

          copy_if_exists "$BUILD/flatc" "$PKG/bin/"
          copy_if_exists "$BUILD/flattests" "$PKG/bin/"
          copy_if_exists "$BUILD/flatsamplebinary" "$PKG/bin/"
          copy_if_exists "$BUILD/flatsampletext" "$PKG/bin/"
          copy_if_exists "$BUILD/flatsamplebfbs" "$PKG/bin/"

          copy_if_exists "$PREFIX/bin/flatc" "$PKG/bin/"
          copy_dir_if_exists "$PREFIX/lib" "$PKG/lib"
          copy_dir_if_exists "$PREFIX/include" "$PKG/include"
          copy_dir_if_exists "$PREFIX/lib/cmake" "$PKG/lib/cmake"

          copy_if_exists "FLATBUFFERS_COMMIT.txt" "$PKG/build-info/"
          copy_if_exists "flatbuffers/CMakeCache.txt" "$PKG/build-info/"
          copy_if_exists "$BUILD/CMakeCache.txt" "$PKG/build-info/"
          copy_if_exists "$BUILD/compile_commands.json" "$PKG/build-info/"

          for src in \
            flatbuffers/CMakeLists.txt \
            flatbuffers/CMake/Version.cmake \
            flatbuffers/tests/fuzzer/CMakeLists.txt \
            flatbuffers/src/flatc.cpp \
            flatbuffers/src/flatc_main.cpp \
            flatbuffers/src/idl_parser.cpp \
            flatbuffers/src/idl_gen_cpp.cpp \
            flatbuffers/include/flatbuffers/flatbuffers.h \
            flatbuffers/include/flatbuffers/verifier.h; do
            copy_if_exists "$src" "$PKG/src-snippets/"
          done

          cat > "$PKG/RUN_ENV.sh" <<'RUNEOF'
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib:${LD_LIBRARY_PATH:-}"
          export PATH="$HERE/bin:$PATH"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
          export ASAN_OPTIONS="abort_on_error=1:halt_on_error=1:symbolize=1:allocator_may_return_null=1"
          export TSAN_OPTIONS="halt_on_error=1:second_deadlock_stack=1"
          export MSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"
          RUNEOF

          chmod +x "$PKG/RUN_ENV.sh"

          cat > "$PKG/README_RUN.txt" <<EOF_README
          Build: ${{ matrix.name }}
          Ref: ${{ github.event.inputs.flatbuffers_ref }}
          Commit: $(cat FLATBUFFERS_COMMIT.txt 2>/dev/null || echo unknown)
          Build type: ${{ matrix.build_type }}
          Compiler: ${{ matrix.cc }} / ${{ matrix.cxx }}

          Usage:
            cd ${{ matrix.name }}
            source ./RUN_ENV.sh
            ./bin/flatc --version
            ./bin/flattests

          Build directory:
            ${BUILD}

          Notes:
            - The release build intentionally leaves FlatBuffers' CMake feature defaults unchanged.
            - The MSan build uses libc++, but meaningful MSan results require an MSan-instrumented C++ standard library and runtime dependencies.
            - The CFI build uses Clang LTO and CFI for indirect-call and virtual-call checking.
          EOF_README

          echo "[+] Packaged files:"
          find "$PKG" -maxdepth 5 -type f | sort

          echo "[+] Binary file info:"
          find "$PKG/bin" -maxdepth 1 -type f -exec file {} \; || true

      - name: Zip build
        shell: bash
        run: |
          set -euxo pipefail

          ZIP="flatbuffers-${{ matrix.name }}-x64-linux.zip"

          cd package
          zip -r "../$ZIP" "${{ matrix.name }}"
          cd ..

          sha256sum "$ZIP" | tee "$ZIP.sha256"
          ls -lh "$ZIP" "$ZIP.sha256"

      - name: Upload to sendit.sh
        shell: bash
        continue-on-error: true
        run: |
          set -uxo pipefail

          ZIP="flatbuffers-${{ matrix.name }}-x64-linux.zip"
          LINK_FILE="flatbuffers-${{ matrix.name }}-sendit-link.txt"

          echo "[+] Uploading $ZIP to sendit.sh"

          LINK=""
          for i in 1 2 3 4 5; do
            echo "[+] Upload attempt $i"

            LINK="$(curl -fsS --retry 3 --retry-all-errors -T "$ZIP" https://sendit.sh || true)"

            if echo "$LINK" | grep -Eiq 'https?://'; then
              echo "[OK] Upload succeeded"
              break
            fi

            echo "[WARN] Upload failed or no link returned. Response:"
            echo "$LINK"
            sleep 10
          done

          if ! echo "$LINK" | grep -Eiq 'https?://'; then
            echo "[WARN] sendit upload failed after retries"
            LINK="SENDIT_UPLOAD_FAILED_USE_GITHUB_ARTIFACT"
          fi

          echo "Download link for ${{ matrix.name }}:"
          echo "$LINK"
          echo "$LINK" > "$LINK_FILE"

      - name: Upload GitHub artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: flatbuffers-${{ matrix.name }}-x64-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            flatbuffers-${{ matrix.name }}-x64-linux.zip
            flatbuffers-${{ matrix.name }}-x64-linux.zip.sha256
            flatbuffers-${{ matrix.name }}-sendit-link.txt
