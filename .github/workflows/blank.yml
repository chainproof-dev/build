name: FlatBuffers Sanitizer Builds Only

on:
  workflow_dispatch:
    inputs:
      flatbuffers_ref:
        description: "FlatBuffers git ref, branch, tag, or commit"
        required: false
        default: "master"

jobs:
  sanitizer-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sanitizer:
          - msan

    steps:
      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build clang lld build-essential \
            libc++-dev libc++abi-dev pkg-config zip curl ca-certificates file

      - name: Clone FlatBuffers
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/google/flatbuffers.git flatbuffers
          cd flatbuffers
          git checkout "${{ github.event.inputs.flatbuffers_ref }}"
          git rev-parse HEAD | tee ../FLATBUFFERS_COMMIT.txt

      - name: Build MSan C++ runtime
        if: matrix.sanitizer == 'msan'
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch llvmorg-18.1.8 \
            https://github.com/llvm/llvm-project.git llvm-project

          cmake -S llvm-project/runtimes -B build/msan-runtime -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_INSTALL_PREFIX="$PWD/msan-runtime" \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind" \
            -DLIBCXX_USE_COMPILER_RT=ON \
            -DLIBCXXABI_USE_COMPILER_RT=ON \
            -DLIBCXXABI_USE_LLVM_UNWINDER=ON \
            -DCMAKE_C_FLAGS="-fsanitize=memory -fno-omit-frame-pointer -fsanitize-memory-track-origins=2" \
            -DCMAKE_CXX_FLAGS="-fsanitize=memory -fno-omit-frame-pointer -fsanitize-memory-track-origins=2" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=memory" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=memory"

          cmake --build build/msan-runtime --parallel "$(nproc)" --target cxx cxxabi unwind
          cmake --install build/msan-runtime

      - name: Configure MSan
        if: matrix.sanitizer == 'msan'
        shell: bash
        run: |
          set -euxo pipefail
          MSAN_ROOT="$PWD/msan-runtime"
          MSAN_CXX="$MSAN_ROOT/include/c++/v1"
          MSAN_LIB="$MSAN_ROOT/lib/x86_64-unknown-linux-gnu"
          test -d "$MSAN_ROOT/include/c++/v1"
          test -d "$MSAN_LIB" || MSAN_LIB="$MSAN_ROOT/lib"

          cmake -S flatbuffers -B build/msan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DFLATBUFFERS_BUILD_TESTS=ON \
            -DFLATBUFFERS_BUILD_FLATLIB=ON \
            -DFLATBUFFERS_BUILD_FLATC=ON \
            -DFLATBUFFERS_INSTALL=ON \
            -DFLATBUFFERS_CODE_SANITIZE==memory \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -nostdinc++ -isystem $MSAN_CXX -fsanitize=memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -L$MSAN_LIB -Wl,-rpath,$MSAN_LIB -fsanitize=memory -fsanitize-memory-track-origins=2"

      - name: Build selected sanitizer targets
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build "build/${{ matrix.sanitizer }}" \
            --parallel "$(nproc)" \
            --target flatbuffers flatc flattests

      - name: Run MSan tests
        if: matrix.sanitizer == 'msan'
        shell: bash
        run: |
          set -euxo pipefail
          MSAN_LIB="$PWD/msan-runtime/lib/x86_64-unknown-linux-gnu"
          LD_LIBRARY_PATH="$MSAN_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
          MSAN_OPTIONS='halt_on_error=1:exit_code=86:print_stacktrace=1' \
          ./build/msan/flattests

      - name: Verify only MSan build exists
        shell: bash
        run: |
          set -euxo pipefail
          test -d build/msan
          for other in asan cfi; do
            if [ -d "build/$other" ]; then
              echo "Unexpected build directory: build/$other"
              exit 1
            fi
          done

      - name: Install selected build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --install "build/${{ matrix.sanitizer }}" \
            --prefix "$PWD/package/${{ matrix.sanitizer }}/install"

      - name: Package selected build
        shell: bash
        run: |
          set -euxo pipefail
          PKG="$PWD/package/${{ matrix.sanitizer }}"
          BUILD="$PWD/build/${{ matrix.sanitizer }}"
          mkdir -p "$PKG/bin" "$PKG/lib" "$PKG/include" "$PKG/build-info"

          cp -a flatbuffers/LICENSE.txt "$PKG/" 2>/dev/null || true
          cp -a "$BUILD/flatc" "$PKG/bin/"
          cp -a "$BUILD/flattests" "$PKG/bin/"
          cp -a "$BUILD/libflatbuffers.a" "$PKG/lib/" 2>/dev/null || true
          cp -a "$PKG/install/include/." "$PKG/include/" 2>/dev/null || true
          cp -a "$PKG/install/lib/." "$PKG/lib/" 2>/dev/null || true
          cp -a FLATBUFFERS_COMMIT.txt "$PKG/build-info/"
          cp -a "$BUILD/compile_commands.json" "$PKG/build-info/" 2>/dev/null || true
          cp -a "$BUILD/CMakeCache.txt" "$PKG/build-info/" 2>/dev/null || true

          cat > "$PKG/RUN_ENV.sh" <<'EOF'
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export PATH="$HERE/bin:$PATH"
          EOF
          chmod +x "$PKG/RUN_ENV.sh"

          echo "sanitizer=${{ matrix.sanitizer }}" > "$PKG/build-info/build.txt"

      - name: Create archive
        shell: bash
        run: |
          set -euxo pipefail
          ARCHIVE="flatbuffers-${{ matrix.sanitizer }}-x64-linux.zip"
          cd package
          zip -r "../$ARCHIVE" "${{ matrix.sanitizer }}"
          cd ..
          sha256sum "$ARCHIVE" | tee "$ARCHIVE.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatbuffers-${{ matrix.sanitizer }}-x64-linux
          path: |
            flatbuffers-${{ matrix.sanitizer }}-x64-linux.zip
            flatbuffers-${{ matrix.sanitizer }}-x64-linux.zip.sha256
          if-no-files-found: error
          retention-days: 7
