name: Build FFmpeg MSan Runtime

on:
  workflow_dispatch:
    inputs:
      ffmpeg_ref:
        description: "FFmpeg git ref, branch, tag, or commit"
        required: false
        default: "master"

jobs:
  build-msan:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      BUILD_NAME: msan
      CC: clang
      CXX: clang++
      CFLAGS_EXTRA: >-
        -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
        -fsanitize=memory -fsanitize-memory-track-origins=2 -fPIE
      LDFLAGS_EXTRA: >-
        -fsanitize=memory -fsanitize-memory-track-origins=2 -fPIE -pie
      ESSENTIAL_TARGETS: "ffmpeg ffprobe"
      OPTIONAL_TARGETS: "tests/videogen tools/target_dem_fuzzer"

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git build-essential clang lld pkg-config yasm nasm \
            zlib1g-dev libssl-dev libxml2-dev zip curl python3 ca-certificates \
            file xz-utils

      - name: Clone FFmpeg
        shell: bash
        run: |
          set -euxo pipefail

          git clone https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg
          git checkout "${{ github.event.inputs.ffmpeg_ref }}"
          git rev-parse HEAD | tee ../FFMPEG_COMMIT.txt
          git status --short

      - name: Configure FFmpeg for MemorySanitizer
        shell: bash
        working-directory: ffmpeg
        run: |
          set -euxo pipefail

          mkdir -p "../out/$BUILD_NAME"

          CMD=(
            ./configure
            --prefix="$PWD/../out/$BUILD_NAME"
            --cc="$CC"
            --cxx="$CXX"
            --ld=clang
            --disable-stripping
            --enable-debug=3
            --disable-optimizations
            --disable-x86asm
            --extra-cflags="$CFLAGS_EXTRA"
            --extra-cxxflags="$CFLAGS_EXTRA"
            --extra-ldflags="$LDFLAGS_EXTRA"
          )

          echo "[+] Configure command:"
          printf ' %q' "${CMD[@]}"
          printf '\n'

          "${CMD[@]}"

      - name: Build essential targets
        shell: bash
        working-directory: ffmpeg
        run: |
          set -euxo pipefail

          echo "[+] Building essential targets: $ESSENTIAL_TARGETS"

          for target in $ESSENTIAL_TARGETS; do
            echo "[+] make $target"
            make -j"$(nproc)" "$target"
          done

      - name: Build optional targets
        shell: bash
        working-directory: ffmpeg
        run: |
          set -uxo pipefail

          echo "[+] Optional targets: $OPTIONAL_TARGETS"

          for target in $OPTIONAL_TARGETS; do
            echo "[+] Trying optional target: $target"
            if make -j"$(nproc)" "$target"; then
              echo "[OK] Built optional target: $target"
            else
              echo "[WARN] Optional target failed or does not exist: $target"
            fi
          done

          if [ ! -x tests/videogen ]; then
            echo "[WARN] tests/videogen missing. Trying manual MSan fallback compile."

            "$CC" \
              $CFLAGS_EXTRA \
              -I. -I./ \
              -o tests/videogen \
              tests/videogen.c -lm \
              $LDFLAGS_EXTRA || echo "[WARN] manual videogen fallback failed"
          fi

      - name: Install FFmpeg
        shell: bash
        working-directory: ffmpeg
        run: |
          set -uxo pipefail

          echo "[+] Running make install"
          if make install; then
            echo "[OK] make install succeeded"
          else
            echo "[WARN] make install failed. Packaging will continue from build tree."
          fi

      - name: Verify MSan instrumentation
        shell: bash
        working-directory: ffmpeg
        run: |
          set -euxo pipefail

          strings ffmpeg | grep -q "MemorySanitizer" || {
            echo "[ERROR] ffmpeg does not appear to contain the MSan runtime"
            exit 1
          }

          strings ffprobe | grep -q "MemorySanitizer" || {
            echo "[ERROR] ffprobe does not appear to contain the MSan runtime"
            exit 1
          }

          echo "[OK] MSan runtime detected in ffmpeg and ffprobe"

      - name: Collect build files safely
        shell: bash
        run: |
          set -euxo pipefail

          PKG="package/$BUILD_NAME"
          PREFIX="$PWD/out/$BUILD_NAME"

          mkdir -p "$PKG/bin" "$PKG/lib" "$PKG/include" "$PKG/build-info" "$PKG/src-snippets"

          copy_if_exists() {
            SRC="$1"
            DST="$2"

            if [ -e "$SRC" ]; then
              cp -a "$SRC" "$DST"
              echo "[copy] $SRC -> $DST"
            else
              echo "[skip] missing: $SRC"
            fi
          }

          copy_dir_if_exists() {
            SRC="$1"
            DST="$2"

            if [ -d "$SRC" ]; then
              mkdir -p "$DST"
              cp -a "$SRC/." "$DST/" || true
              echo "[copy-dir] $SRC -> $DST"
            else
              echo "[skip-dir] missing: $SRC"
            fi
          }

          copy_if_exists "ffmpeg/ffmpeg" "$PKG/bin/"
          copy_if_exists "ffmpeg/ffprobe" "$PKG/bin/"
          copy_if_exists "ffmpeg/tests/videogen" "$PKG/bin/"
          copy_if_exists "ffmpeg/tools/target_dem_fuzzer" "$PKG/bin/"

          copy_if_exists "$PREFIX/bin/ffmpeg" "$PKG/bin/"
          copy_if_exists "$PREFIX/bin/ffprobe" "$PKG/bin/"

          copy_dir_if_exists "$PREFIX/lib" "$PKG/lib"
          copy_dir_if_exists "$PREFIX/include" "$PKG/include"

          for lib in \
            ffmpeg/libavutil/libavutil.a \
            ffmpeg/libavcodec/libavcodec.a \
            ffmpeg/libavformat/libavformat.a \
            ffmpeg/libavdevice/libavdevice.a \
            ffmpeg/libavfilter/libavfilter.a \
            ffmpeg/libswscale/libswscale.a \
            ffmpeg/libswresample/libswresample.a
          do
            copy_if_exists "$lib" "$PKG/lib/"
          done

          copy_if_exists "ffmpeg/config.h" "$PKG/build-info/"
          copy_if_exists "ffmpeg/config.log" "$PKG/build-info/"
          copy_if_exists "ffmpeg/ffbuild/config.log" "$PKG/build-info/"
          copy_if_exists "ffmpeg/ffbuild/config.mak" "$PKG/build-info/"
          copy_if_exists "ffmpeg/ffbuild/config.sh" "$PKG/build-info/"
          copy_if_exists "FFMPEG_COMMIT.txt" "$PKG/build-info/"

          for src in \
            ffmpeg/libavformat/webp_anim_dec.c \
            ffmpeg/libavformat/http.c \
            ffmpeg/libavformat/rtsp.c \
            ffmpeg/libavformat/mov.c \
            ffmpeg/libavformat/concatdec.c \
            ffmpeg/libavformat/id3v2.c \
            ffmpeg/libavformat/omadec.c \
            ffmpeg/libavformat/matroskadec.c \
            ffmpeg/libavutil/rc4.c \
            ffmpeg/libavutil/blowfish.c \
            ffmpeg/libavutil/aes_ctr.c \
            ffmpeg/tests/videogen.c \
            ffmpeg/tests/utils.c
          do
            copy_if_exists "$src" "$PKG/src-snippets/"
          done

          cat > "$PKG/RUN_ENV.sh" <<'RUNEOF'
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib:${LD_LIBRARY_PATH:-}"
          export MSAN_OPTIONS="halt_on_error=1:abort_on_error=1:exit_code=86:symbolize=1:print_stats=1:track_origins=2"
          export PATH="$HERE/bin:$PATH"
          RUNEOF

          chmod +x "$PKG/RUN_ENV.sh"

          cat > "$PKG/README_RUN.txt" <<EOF2
          Build: $BUILD_NAME
          Sanitizer: Clang MemorySanitizer with origin tracking level 2
          Commit: $(cat FFMPEG_COMMIT.txt 2>/dev/null || echo unknown)

          Usage:
            cd $BUILD_NAME
            source ./RUN_ENV.sh
            ./bin/ffmpeg -version
            ./bin/ffprobe -version

          WebP test example:
            ./bin/ffprobe -v trace crafted.webp

          A MemorySanitizer finding exits with status 86.
          EOF2

          echo "[+] Packaged files:"
          find "$PKG" -maxdepth 4 -type f | sort

          echo "[+] Binary file info:"
          find "$PKG/bin" -maxdepth 1 -type f -exec file {} \; || true

      - name: Zip build
        shell: bash
        run: |
          set -euxo pipefail

          ZIP="ffmpeg-$BUILD_NAME-x64-linux.zip"

          cd package
          zip -r "../$ZIP" "$BUILD_NAME"
          cd ..

          sha256sum "$ZIP" | tee "$ZIP.sha256"
          ls -lh "$ZIP" "$ZIP.sha256"

      - name: Upload to sendit.sh
        shell: bash
        continue-on-error: true
        run: |
          set -uxo pipefail

          ZIP="ffmpeg-$BUILD_NAME-x64-linux.zip"
          LINK_FILE="ffmpeg-$BUILD_NAME-sendit-link.txt"

          echo "[+] Uploading $ZIP to sendit.sh"

          LINK=""

          for i in 1 2 3 4 5; do
            echo "[+] Upload attempt $i"

            LINK="$(curl -fsS --retry 3 --retry-all-errors -T "$ZIP" https://sendit.sh || true)"

            if echo "$LINK" | grep -Eiq 'https?://'; then
              echo "[OK] Upload succeeded"
              break
            fi

            echo "[WARN] Upload failed or no link returned. Response:"
            echo "$LINK"
            sleep 10
          done

          if ! echo "$LINK" | grep -Eiq 'https?://'; then
            echo "[WARN] sendit upload failed after retries"
            LINK="SENDIT_UPLOAD_FAILED_USE_GITHUB_ARTIFACT"
          fi

          echo "Download link for $BUILD_NAME:"
          echo "$LINK"
          echo "$LINK" > "$LINK_FILE"

      - name: Upload GitHub artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-msan-x64-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            ffmpeg-msan-x64-linux.zip
            ffmpeg-msan-x64-linux.zip.sha256
            ffmpeg-msan-sendit-link.txt
