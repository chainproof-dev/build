name: Build c-ares Security Research Targets

on:
  workflow_dispatch:
    inputs:
      cares_ref:
        description: "c-ares git ref, branch, tag, or commit"
        required: false
        default: "main"
      run_tests:
        description: "Run the c-ares test suite after building"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            id: asan-ubsan
            build_type: Debug
            c_flags: >-
              -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined
              -fno-sanitize-recover=all
            cxx_flags: >-
              -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined
              -fno-sanitize-recover=all
            linker_flags: >-
              -fsanitize=address,undefined
            runtime_env: >-
              ASAN_OPTIONS=abort_on_error=1:halt_on_error=1:detect_leaks=1:strict_string_checks=1:check_initialization_order=1:symbolize=1
              UBSAN_OPTIONS=abort_on_error=1:halt_on_error=1:print_stacktrace=1:symbolize=1
            run_tests: true

          - name: MemorySanitizer
            id: msan
            build_type: Debug
            c_flags: >-
              -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=memory -fsanitize-memory-track-origins=2
              -fPIE
            cxx_flags: >-
              -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=memory -fsanitize-memory-track-origins=2
              -fPIE
            linker_flags: >-
              -fsanitize=memory -fsanitize-memory-track-origins=2
              -fPIE -pie
            runtime_env: >-
              MSAN_OPTIONS=abort_on_error=1:halt_on_error=1:exit_code=86:track_origins=2:symbolize=1:print_stats=1
            # GTest/libstdc++ from Ubuntu are not MSan-instrumented. Build and package
            # the targets, but do not execute them automatically to avoid false positives.
            run_tests: false

          - name: ThreadSanitizer
            id: tsan
            build_type: Debug
            c_flags: >-
              -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=thread
            cxx_flags: >-
              -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=thread
            linker_flags: >-
              -fsanitize=thread
            runtime_env: >-
              TSAN_OPTIONS=abort_on_error=1:halt_on_error=1:second_deadlock_stack=1:history_size=7:symbolize=1
            run_tests: true

          - name: Coverage
            id: coverage
            build_type: Debug
            c_flags: >-
              -O0 -g3 -fno-omit-frame-pointer
              -fprofile-instr-generate -fcoverage-mapping
            cxx_flags: >-
              -O0 -g3 -fno-omit-frame-pointer
              -fprofile-instr-generate -fcoverage-mapping
            linker_flags: >-
              -fprofile-instr-generate -fcoverage-mapping
            runtime_env: >-
              LLVM_PROFILE_FILE=cares-%p.profraw
            run_tests: true

          - name: Hardened RelWithDebInfo
            id: hardened
            build_type: RelWithDebInfo
            c_flags: >-
              -O2 -g3 -fno-omit-frame-pointer
              -fstack-protector-strong -D_FORTIFY_SOURCE=3
              -fPIE -Wformat -Wformat-security -Werror=format-security
            cxx_flags: >-
              -O2 -g3 -fno-omit-frame-pointer
              -fstack-protector-strong -D_FORTIFY_SOURCE=3
              -fPIE -Wformat -Wformat-security -Werror=format-security
            linker_flags: >-
              -fPIE -pie -Wl,-z,relro,-z,now -Wl,-z,noexecstack
            runtime_env: ""
            run_tests: true

          - name: Release Baseline
            id: release
            build_type: Release
            c_flags: >-
              -O2 -g1 -fno-omit-frame-pointer
            cxx_flags: >-
              -O2 -g1 -fno-omit-frame-pointer
            linker_flags: ""
            runtime_env: ""
            run_tests: true

    env:
      CC: clang
      CXX: clang++
      BUILD_DIR: build-${{ matrix.id }}
      INSTALL_DIR: install-${{ matrix.id }}
      PACKAGE_DIR: package/c-ares-${{ matrix.id }}

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential clang llvm lld cmake ninja-build \
            pkg-config libc-ares-dev libgtest-dev libgmock-dev googletest \
            python3 zip file ca-certificates

          clang --version
          cmake --version
          ninja --version
          llvm-symbolizer --version

      - name: Build GoogleTest and GoogleMock
        shell: bash
        run: |
          set -euxo pipefail

          # Ubuntu may expose GTestConfig.cmake without the GTest::gmock target.
          # Build and install the packaged googletest sources into /usr/local,
          # then explicitly pass that config directory to c-ares.
          sudo rm -rf /tmp/googletest-build
          sudo cmake -S /usr/src/googletest -B /tmp/googletest-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_GMOCK=ON \
            -DINSTALL_GTEST=ON
          sudo cmake --build /tmp/googletest-build --parallel "$(nproc)"
          sudo cmake --install /tmp/googletest-build
          sudo ldconfig

          test -f /usr/local/lib/cmake/GTest/GTestConfig.cmake
          grep -R "GTest::gmock" /usr/local/lib/cmake/GTest

      - name: Clone c-ares
        shell: bash
        run: |
          set -euxo pipefail

          git clone https://github.com/c-ares/c-ares.git c-ares
          cd c-ares
          git checkout "${{ inputs.cares_ref }}"
          git submodule update --init --recursive
          git rev-parse HEAD | tee ../CARES_COMMIT.txt
          git status --short

      - name: Configure ${{ matrix.name }}
        shell: bash
        run: |
          set -euxo pipefail

          cmake -S c-ares -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_INSTALL_PREFIX="$PWD/$INSTALL_DIR" \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DGTest_DIR=/usr/local/lib/cmake/GTest \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DCMAKE_C_FLAGS="${{ matrix.c_flags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.linker_flags }}" \
            -DCARES_STATIC=ON \
            -DCARES_SHARED=ON \
            -DCARES_STATIC_PIC=ON \
            -DCARES_BUILD_TESTS=ON \
            -DCARES_BUILD_TOOLS=ON \
            -DCARES_THREADS=ON \
            -DCARES_WERROR=OFF \
            -DCARES_COVERAGE=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build library, tools, tests, and fuzz drivers
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build "$BUILD_DIR" --parallel "$(nproc)" --verbose

          echo "Built executables:"
          find "$BUILD_DIR" -maxdepth 4 -type f -executable -print | sort

      - name: Verify sanitizer instrumentation
        if: matrix.id == 'asan-ubsan' || matrix.id == 'msan' || matrix.id == 'tsan'
        shell: bash
        run: |
          set -euxo pipefail

          case "${{ matrix.id }}" in
            asan-ubsan)
              needle='__asan_init|__ubsan_handle'
              ;;
            msan)
              needle='__msan_init'
              ;;
            tsan)
              needle='__tsan_init'
              ;;
          esac

          mapfile -t candidates < <(
            find "$BUILD_DIR" -type f -executable \
              \( -name 'arestest' -o -name 'aresfuzz' -o -name 'aresfuzzname' -o -name 'adig' -o -name 'ahost' \)
          )

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "No executable candidate found for instrumentation verification"
            exit 1
          fi

          verified=0
          for binary in "${candidates[@]}"; do
            if nm -an "$binary" 2>/dev/null | grep -Eq "$needle"; then
              echo "Instrumentation detected in $binary"
              verified=1
              break
            fi
          done

          test "$verified" -eq 1

      - name: Run tests and bundled fuzz corpora
        if: inputs.run_tests && matrix.run_tests
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="/usr/lib/llvm-18/bin:$PATH"
          export LLVM_SYMBOLIZER_PATH="$(command -v llvm-symbolizer)"

          # Convert the matrix runtime string into exported KEY=VALUE pairs.
          while IFS= read -r assignment; do
            [ -z "$assignment" ] && continue
            export "$assignment"
          done < <(printf '%s\n' '${{ matrix.runtime_env }}' | tr ' ' '\n')

          ctest --test-dir "$BUILD_DIR" \
            --output-on-failure \
            --timeout 180 \
            --parallel "$(nproc)"

      - name: Generate LLVM coverage report
        if: matrix.id == 'coverage' && inputs.run_tests
        shell: bash
        run: |
          set -euxo pipefail

          mapfile -t profiles < <(find . -name '*.profraw' -type f)
          if [ "${#profiles[@]}" -eq 0 ]; then
            echo "No .profraw files were produced"
            exit 1
          fi

          llvm-profdata merge -sparse "${profiles[@]}" -o "$BUILD_DIR/cares.profdata"

          mapfile -t objects < <(
            find "$BUILD_DIR" -type f -executable \
              \( -name 'arestest' -o -name 'aresfuzz' -o -name 'aresfuzzname' -o -name 'adig' -o -name 'ahost' \)
          )

          if [ "${#objects[@]}" -eq 0 ]; then
            echo "No instrumented executables found"
            exit 1
          fi

          primary_object="${objects[0]}"
          object_args=()
          for object in "${objects[@]:1}"; do
            object_args+=( -object "$object" )
          done

          llvm-cov report "$primary_object" "${object_args[@]}" \
            -instr-profile="$BUILD_DIR/cares.profdata" \
            -ignore-filename-regex='(test|third_party|CMakeFiles)' \
            | tee "$BUILD_DIR/coverage-summary.txt"

          llvm-cov show "$primary_object" "${object_args[@]}" \
            -instr-profile="$BUILD_DIR/cares.profdata" \
            -format=html \
            -output-dir="$BUILD_DIR/coverage-html" \
            -ignore-filename-regex='(test|third_party|CMakeFiles)'

      - name: Install build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --install "$BUILD_DIR"

      - name: Package research build
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$PACKAGE_DIR"/{bin,lib,include,build-info,corpora,source}

          copy_if_exists() {
            local src="$1"
            local dst="$2"
            if [ -e "$src" ]; then
              cp -a "$src" "$dst"
            fi
          }

          copy_tree_if_exists() {
            local src="$1"
            local dst="$2"
            if [ -d "$src" ]; then
              mkdir -p "$dst"
              cp -a "$src/." "$dst/"
            fi
          }

          copy_tree_if_exists "$INSTALL_DIR/bin" "$PACKAGE_DIR/bin"
          copy_tree_if_exists "$INSTALL_DIR/lib" "$PACKAGE_DIR/lib"
          copy_tree_if_exists "$INSTALL_DIR/include" "$PACKAGE_DIR/include"

          while IFS= read -r binary; do
            copy_if_exists "$binary" "$PACKAGE_DIR/bin/"
          done < <(
            find "$BUILD_DIR" -type f -executable \
              \( -name 'arestest' -o -name 'aresfuzz' -o -name 'aresfuzzname' \
                 -o -name 'dnsdump' -o -name 'ares_queryloop' -o -name 'adig' -o -name 'ahost' \)
          )

          find "$BUILD_DIR" -type f \
            \( -name 'libcares*.a' -o -name 'libcares*.so*' \) \
            -exec cp -a {} "$PACKAGE_DIR/lib/" \;

          copy_if_exists "$BUILD_DIR/compile_commands.json" "$PACKAGE_DIR/build-info/"
          copy_if_exists "$BUILD_DIR/CMakeCache.txt" "$PACKAGE_DIR/build-info/"
          copy_if_exists "$BUILD_DIR/coverage-summary.txt" "$PACKAGE_DIR/build-info/"
          copy_if_exists "$BUILD_DIR/cares.profdata" "$PACKAGE_DIR/build-info/"
          copy_tree_if_exists "$BUILD_DIR/coverage-html" "$PACKAGE_DIR/coverage-html"
          copy_if_exists "CARES_COMMIT.txt" "$PACKAGE_DIR/build-info/"

          copy_tree_if_exists "c-ares/test/fuzzinput" "$PACKAGE_DIR/corpora/fuzzinput"
          copy_tree_if_exists "c-ares/test/fuzznames" "$PACKAGE_DIR/corpora/fuzznames"

          for src in \
            c-ares/src/lib/ares_process.c \
            c-ares/src/lib/ares_getaddrinfo.c \
            c-ares/src/lib/ares_dns_record.c \
            c-ares/src/lib/ares_parse_*.c \
            c-ares/src/lib/ares_expand_name.c
          do
            for file in $src; do
              copy_if_exists "$file" "$PACKAGE_DIR/source/"
            done
          done

          cat > "$PACKAGE_DIR/RUN_ENV.sh" <<EOF
          #!/usr/bin/env bash
          HERE="\$(cd "\$(dirname "\${BASH_SOURCE[0]}")" && pwd)"
          export PATH="\$HERE/bin:\$PATH"
          export LD_LIBRARY_PATH="\$HERE/lib:\${LD_LIBRARY_PATH:-}"
          export LLVM_SYMBOLIZER_PATH="\${LLVM_SYMBOLIZER_PATH:-\$(command -v llvm-symbolizer 2>/dev/null || true)}"
          EOF

          case "${{ matrix.id }}" in
            asan-ubsan)
              cat >> "$PACKAGE_DIR/RUN_ENV.sh" <<'EOF'
          export ASAN_OPTIONS="abort_on_error=1:halt_on_error=1:detect_leaks=1:strict_string_checks=1:symbolize=1"
          export UBSAN_OPTIONS="abort_on_error=1:halt_on_error=1:print_stacktrace=1:symbolize=1"
          EOF
              ;;
            msan)
              cat >> "$PACKAGE_DIR/RUN_ENV.sh" <<'EOF'
          export MSAN_OPTIONS="abort_on_error=1:halt_on_error=1:exit_code=86:track_origins=2:symbolize=1:print_stats=1"
          EOF
              ;;
            tsan)
              cat >> "$PACKAGE_DIR/RUN_ENV.sh" <<'EOF'
          export TSAN_OPTIONS="abort_on_error=1:halt_on_error=1:second_deadlock_stack=1:history_size=7:symbolize=1"
          EOF
              ;;
          esac

          chmod +x "$PACKAGE_DIR/RUN_ENV.sh"

          cat > "$PACKAGE_DIR/README_RUN.txt" <<EOF
          c-ares security research build
          Build: ${{ matrix.name }}
          Commit: $(cat CARES_COMMIT.txt)

          Usage:
            source ./RUN_ENV.sh
            ./bin/arestest

          Bundled parser corpus drivers, when present:
            ./bin/aresfuzz corpora/fuzzinput/*
            ./bin/aresfuzzname corpora/fuzznames/*

          Notes:
          - MSan is most reliable when every dependency involved in the tested path is also MSan-instrumented.
          - TSan is intended for threaded asynchronous/channel lifecycle testing.
          - ASan+UBSan is the default build for malformed packet and parser PoCs.
          EOF

          find "$PACKAGE_DIR" -maxdepth 4 -type f | sort

      - name: Create archive and checksum
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE="c-ares-${{ matrix.id }}-x86_64-linux.zip"
          cd package
          zip -r "../$ARCHIVE" "c-ares-${{ matrix.id }}"
          cd ..
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          ls -lh "$ARCHIVE" "$ARCHIVE.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: c-ares-${{ matrix.id }}-x86_64-linux
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            c-ares-${{ matrix.id }}-x86_64-linux.zip
            c-ares-${{ matrix.id }}-x86_64-linux.zip.sha256
